<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portofolio PPG Calon Guru IPS 2026 — Kartina Angreni Nasution</title>
<meta name="description" content="Portofolio Praktik Pengalaman Lapangan (PPL) Mandiri Program Profesi Guru (Calon Guru) Pendidikan IPS Universitas Negeri Yogyakarta tahun 2026 — Kartina Angreni Nasution.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   Portofolio PPG Calon Guru IPS 2026 — Kartina Angreni Nasution
   Tema: biru muda elegan
   ========================================================== */
:root{
  --bg:#FAF8F3;
  --bg-2:#F3EEE0;
  --surface:#FFFFFF;
  --sky:#EFE4C6;
  --sky-2:#C9A961;
  --blue:#1B3A6B;
  --blue-2:#12294F;
  --navy:#0F2547;
  --ink:#1E2A3C;
  --muted:#5E6B7E;
  --gold:#B8924A;
  --gold-soft:#E6CE94;
  --line:#E7E0CD;
  --radius:14px;
  --shadow:0 8px 28px rgba(15,37,71,.08);
  --shadow-lg:0 18px 44px rgba(15,37,71,.14);
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Lato','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);color:var(--ink);line-height:1.75;font-size:16px;
  background:var(--bg);
  background-image:radial-gradient(900px 420px at 100% 0,rgba(201,169,97,.12) 0,transparent 62%),radial-gradient(800px 420px at 0 0,rgba(15,37,71,.05) 0,transparent 60%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:var(--blue);text-decoration:none}
a:hover{color:var(--navy)}
.container{width:min(1140px,92%);margin-inline:auto}
.narrow{width:min(860px,92%);margin-inline:auto}

/* ---------- Header ---------- */
.site-header{
  position:sticky;top:0;z-index:50;
  background:rgba(250,248,243,.88);backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
}
.site-header.on-hero{position:fixed;left:0;right:0;background:rgba(10,26,52,.38);border-bottom-color:rgba(255,255,255,.15)}
.site-header.on-hero.scrolled{background:rgba(250,248,243,.95);border-bottom-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-weight:700;color:var(--navy);font-size:1.05rem;line-height:1.15}
.brand small{display:block;font-family:var(--sans);font-weight:500;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;font-family:var(--serif);font-size:1.1rem;box-shadow:var(--shadow)}
.site-header.on-hero:not(.scrolled) .brand,.site-header.on-hero:not(.scrolled) .brand small{color:#fff}
.menu{display:flex;gap:4px;list-style:none;align-items:center}
.menu a{display:block;padding:8px 13px;border-radius:999px;font-size:.88rem;font-weight:600;color:var(--navy);transition:.2s}
.menu a:hover{background:var(--sky)}
.menu a.active{background:var(--navy);color:#fff}
.site-header.on-hero:not(.scrolled) .menu a{color:#fff}
.site-header.on-hero:not(.scrolled) .menu a:hover{background:rgba(255,255,255,.2)}
.site-header.on-hero:not(.scrolled) .menu a.active{background:#fff;color:var(--navy)}
.burger{display:none;background:none;border:0;cursor:pointer;width:42px;height:42px;border-radius:10px;color:var(--navy)}
.site-header.on-hero:not(.scrolled) .burger{color:#fff}
.burger svg{width:26px;height:26px}

/* ---------- Hero ---------- */
.hero{
  position:relative;min-height:100vh;display:flex;align-items:center;color:#fff;
  background-color:var(--navy);
  background-image:
    linear-gradient(105deg,rgba(8,22,46,.92) 0%,rgba(15,37,71,.78) 50%,rgba(27,58,107,.50) 100%),
    url('https://uny.ac.id/sites/default/files/2024-02/Kumbara%20Rektorat%20UNY_0.jpg');
  background-size:cover;background-position:center;
}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:140px;background:linear-gradient(to bottom,transparent,var(--bg))}
.hero-inner{position:relative;z-index:2;padding:120px 0 150px;max-width:760px}
.eyebrow{display:inline-block;font-size:.76rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:7px 14px;border:1px solid rgba(255,255,255,.4);border-radius:999px;background:rgba(255,255,255,.1);margin-bottom:22px}
.hero h1{font-family:var(--serif);font-size:clamp(2.1rem,5.2vw,3.7rem);line-height:1.12;font-weight:700;margin-bottom:20px}
.hero h1 em{font-style:italic;color:var(--sky)}
.hero p{font-size:1.06rem;color:#E4EAF4;max-width:640px}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28)}
.hero-cta{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:9px;padding:12px 22px;border-radius:999px;font-weight:700;font-size:.92rem;border:1.5px solid transparent;cursor:pointer;transition:.22s;font-family:var(--sans)}
.btn svg{width:18px;height:18px}
.btn-primary{background:#fff;color:var(--navy)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);color:var(--navy)}
.btn-ghost{border-color:rgba(255,255,255,.6);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.16);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:var(--navy);color:#fff;transform:translateY(-2px)}
.btn-outline{border-color:var(--blue);color:var(--blue);background:transparent}
.btn-outline:hover{background:var(--blue);color:#fff}
.btn-sm{padding:8px 15px;font-size:.82rem}

/* ---------- Sections ---------- */
.section{padding:84px 0}
.section.tight{padding:56px 0}
.section-head{text-align:center;max-width:720px;margin:0 auto 46px}
.kicker{font-size:.76rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--blue)}
.section-head h2,.page-title h1{font-family:var(--serif);color:var(--navy);font-size:clamp(1.7rem,3.4vw,2.5rem);line-height:1.2;margin:10px 0 12px}
.section-head p{color:var(--muted)}
.rule{width:64px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--sky-2));margin:16px auto 0}

.page-title{padding:64px 0 30px;text-align:center}
.page-title.left{text-align:left}
.page-title p{color:var(--muted);max-width:720px;margin-inline:auto}
.page-title.left p{margin-inline:0}
.crumbs{font-size:.82rem;color:var(--muted);margin-bottom:12px}
.crumbs a{color:var(--muted)}
.crumbs a:hover{color:var(--navy)}

/* ---------- Cards ---------- */
.grid{display:grid;gap:22px}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);transition:.28s}
a.card{display:block;color:inherit}
a.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--sky-2)}
.icon-card{position:relative;overflow:hidden}
.icon-card::before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,var(--sky) 0,transparent 70%);opacity:.7}
.ico{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--sky),#FBF6E8);color:var(--blue-2);margin-bottom:18px;position:relative}
.ico svg{width:30px;height:30px}
.card h3{font-family:var(--serif);color:var(--navy);font-size:1.28rem;line-height:1.25;margin-bottom:8px;position:relative}
.card p{color:var(--muted);font-size:.95rem;position:relative}
.go{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-weight:700;font-size:.86rem;color:var(--blue);position:relative}
a.card:hover .go{gap:11px}
.num{font-family:var(--serif);font-size:2.4rem;color:var(--sky-2);line-height:1;margin-bottom:10px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 11px;border-radius:999px;background:var(--bg-2);color:var(--blue-2);margin-bottom:12px}
.tag.gold{background:#F8EFD8;color:#8A6A1E}

/* ---------- Prose ---------- */
.prose p{margin-bottom:1.05em;text-align:justify;hyphens:auto}
.prose h3{font-family:var(--serif);color:var(--navy);font-size:1.35rem;margin:1.6em 0 .6em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:38px;box-shadow:var(--shadow)}
.quote{margin:26px 0;padding:22px 26px;border-left:4px solid var(--gold);background:linear-gradient(90deg,#FBF3DC,transparent);font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--navy);border-radius:0 12px 12px 0}
.quote cite{display:block;margin-top:8px;font-family:var(--sans);font-style:normal;font-weight:700;font-size:.9rem;color:var(--muted)}

/* ---------- Profil ---------- */
.profile-hero{display:grid;grid-template-columns:320px 1fr;gap:44px;align-items:center}
.photo-frame{position:relative;border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg);border:6px solid #fff;aspect-ratio:3/4;background:var(--sky)}
.photo-frame img{width:100%;height:100%;object-fit:cover}
.id-table{width:100%;border-collapse:collapse;margin-top:18px}
.id-table td{padding:9px 0;border-bottom:1px dashed var(--line);vertical-align:top;font-size:.96rem}
.id-table td:first-child{color:var(--muted);width:170px;font-weight:600}
.id-table td:nth-child(2){width:18px;color:var(--muted)}
.comp-list{display:grid;gap:14px}
.comp{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.comp b{display:block;color:var(--navy);font-family:var(--serif);font-size:1.08rem}
.comp span{color:var(--muted);font-size:.94rem}
.comp .dot{flex:none;width:38px;height:38px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:700}
.char-list{list-style:none;display:grid;gap:14px}
.char-list li{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:14px;padding:16px 20px}
.char-list b{color:var(--navy)}
.mission{background:linear-gradient(135deg,var(--navy),var(--blue-2));color:#fff;border-radius:var(--radius);padding:38px;box-shadow:var(--shadow-lg)}
.mission h3{font-family:var(--serif);font-size:1.5rem;margin-bottom:10px;color:#fff}
.mission p{color:#E4EAF4;font-size:1.08rem}

/* ---------- Laporan siklus ---------- */
.cycle-nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:34px}
.cycle-nav a{padding:9px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.86rem;color:var(--navy);transition:.2s}
.cycle-nav a:hover{border-color:var(--blue)}
.cycle-nav a.active{background:var(--navy);border-color:var(--navy);color:#fff}
.meta-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:34px}
.meta-table td{padding:12px 18px;border-bottom:1px solid var(--line);font-size:.96rem}
.meta-table tr:last-child td{border-bottom:0}
.meta-table td:first-child{width:230px;background:var(--bg-2);font-weight:700;color:var(--navy)}
.meta-table td:nth-child(2){width:24px;text-align:center;color:var(--muted)}
.report-sec{margin-bottom:34px}
.report-sec>h2{font-family:var(--serif);font-size:1.55rem;color:var(--navy);padding-bottom:10px;margin-bottom:18px;border-bottom:2px solid var(--sky)}
.report-sec p{margin-bottom:1em;text-align:justify;hyphens:auto}
.butir{list-style:none;display:grid;gap:14px}
.butir li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px;position:relative;padding-left:46px}
.butir li::before{content:"";position:absolute;left:20px;top:24px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--sky)}
.butir b{color:var(--navy)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.col-box{border-radius:var(--radius);padding:24px;border:1px solid var(--line);background:var(--surface)}
.col-box.plus{border-top:5px solid #2F7D6B}
.col-box.minus{border-top:5px solid #B8743A}
.col-box h3{font-family:var(--serif);font-size:1.15rem;margin-bottom:14px;color:var(--navy)}
.col-box ul{list-style:none;display:grid;gap:12px}
.col-box li{font-size:.93rem;color:#2A3850;padding-left:18px;position:relative}
.col-box li::before{content:"";position:absolute;left:0;top:.7em;width:7px;height:7px;border-radius:50%}
.col-box.plus li::before{background:#2F7D6B}
.col-box.minus li::before{background:#B8743A}
.col-box li b{color:var(--navy)}
.pager{display:flex;justify-content:space-between;gap:14px;margin-top:40px;flex-wrap:wrap}

/* ---------- Artefak ---------- */
.doc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.doc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.doc-card h3{font-family:var(--serif);color:var(--navy);font-size:1.15rem}
.doc-card p{color:var(--muted);font-size:.9rem;flex:1}
.doc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.embed{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:#fff}
.embed iframe{width:100%;border:0;display:block}
.embed.map iframe{height:440px}
.embed.video iframe{height:480px}
.embed.folder iframe{height:520px}
.note{font-size:.88rem;color:var(--muted);margin-top:10px}

/* ---------- Refleksi ---------- */
.reflect-card{margin-bottom:26px}
.reflect-card h3{margin-bottom:14px}
.reflect-card .sub{font-weight:700;color:var(--blue-2);margin:16px 0 8px;font-size:.88rem;letter-spacing:.08em;text-transform:uppercase}

/* ---------- Non mengajar ---------- */
.act-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow);display:flex;gap:18px}
.act .n{flex:none;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:700}
.act h3{font-family:var(--serif);color:var(--navy);font-size:1.12rem;margin-bottom:6px}
.act p{font-size:.93rem;color:var(--muted);text-align:justify}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{padding:8px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.85rem;font-weight:600;color:var(--navy)}
.eval-list{list-style:decimal;padding-left:22px;margin-top:8px}
.eval-list li{margin-bottom:6px}

/* ---------- Footer ---------- */
.site-footer{margin-top:60px;background:var(--navy);color:#C9D3E3;padding:48px 0 28px}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:34px}
.site-footer h4{font-family:var(--serif);color:#fff;margin-bottom:12px;font-size:1.05rem}
.site-footer a{color:#C9D3E3;display:block;padding:3px 0;font-size:.9rem}
.site-footer a:hover{color:#fff}
.site-footer p{font-size:.9rem}
.copy{margin-top:30px;padding-top:18px;border-top:1px solid rgba(255,255,255,.14);font-size:.82rem;text-align:center;color:#8FA0BA}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(8,22,46,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-box{width:min(1100px,100%);height:min(86vh,820px);background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:var(--navy);color:#fff}
.modal-bar b{font-family:var(--serif);font-size:1rem}
.modal-bar .acts{display:flex;gap:8px}
.modal-bar a,.modal-bar button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:var(--sans)}
.modal-bar a:hover,.modal-bar button:hover{background:rgba(255,255,255,.26);color:#fff}
.modal-box iframe{flex:1;border:0;width:100%}

/* ---------- Reveal ---------- */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}

/* ---------- Responsive ---------- */
@media(max-width:980px){
  .grid-3{grid-template-columns:repeat(2,1fr)}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .profile-hero{grid-template-columns:1fr;text-align:center}
  .photo-frame{max-width:300px;margin-inline:auto}
  .id-table{text-align:left}
  .foot-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:820px){
  .burger{display:grid;place-items:center}
  .menu{position:absolute;top:68px;left:0;right:0;flex-direction:column;align-items:stretch;background:rgba(250,248,243,.99);padding:12px 4%;border-bottom:1px solid var(--line);display:none;box-shadow:var(--shadow)}
  .menu.open{display:flex}
  .menu a,.site-header.on-hero:not(.scrolled) .menu a{color:var(--navy)}
  .menu a.active,.site-header.on-hero:not(.scrolled) .menu a.active{background:var(--navy);color:#fff}
}
@media(max-width:680px){
  .grid-3,.grid-2,.grid-4,.two-col,.act-grid,.foot-grid{grid-template-columns:1fr}
  .section{padding:60px 0}
  .panel{padding:24px}
  .meta-table td:first-child{width:130px}
  .meta-table td{padding:10px 12px;font-size:.9rem}
  .hero-inner{padding:110px 0 130px}
  .embed.map iframe,.embed.video iframe,.embed.folder iframe{height:340px}
  .prose p,.report-sec p{text-align:left}
}
@media print{
  .site-header,.site-footer,.cycle-nav,.pager,.modal{display:none!important}
  body{background:#fff}
}




/* ==========================================================
   Modern Academic & Professional — Navy · Gold · Off-white
   ========================================================== */
body{font-weight:400;letter-spacing:.005em}
h1,h2,h3,h4{font-family:var(--serif)}

/* Pemisah emas tipis */
.rule{height:2px;width:90px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--sky-2),transparent);margin:18px auto 0;position:relative}
.rule::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;background:var(--sky-2);transform:translate(-50%,-50%) rotate(45deg)}
.page-title.left .rule{margin-left:0}

/* Label kecil */
.kicker{font-family:var(--sans);font-size:.74rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);display:inline-flex;align-items:center;gap:14px}
.kicker::before,.kicker::after{content:"";width:34px;height:1px;background:var(--sky-2);margin:0}
.eyebrow{font-family:var(--sans);font-size:.74rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-soft);border:1px solid rgba(201,169,97,.7);background:rgba(15,37,71,.35);padding:8px 18px}

/* Header */
.site-header{border-bottom:1px solid var(--line)}
.site-header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--sky-2),transparent);opacity:.7}
.brand{font-family:var(--serif)}
.brand small{letter-spacing:.2em;color:var(--gold)}
.brand-mark{background:var(--navy);color:var(--gold-soft);border-radius:50%;border:1.5px solid var(--sky-2);font-family:var(--serif);font-style:italic;box-shadow:0 4px 12px rgba(15,37,71,.2)}
.site-header.on-hero:not(.scrolled) .brand small{color:var(--gold-soft)}
.menu a{font-weight:700;letter-spacing:.03em;font-size:.84rem;border-radius:4px}
.menu a:hover{background:var(--sky);color:var(--navy)}
.menu a.active{background:var(--navy);color:var(--gold-soft);box-shadow:none;border-bottom:2px solid var(--sky-2);border-radius:4px}
.site-header.on-hero:not(.scrolled) .menu a:hover{background:rgba(255,255,255,.12)}
.site-header.on-hero:not(.scrolled) .menu a.active{background:rgba(201,169,97,.2);color:var(--gold-soft);border-bottom-color:var(--sky-2)}

/* Hero */
.hero::before{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:radial-gradient(700px 420px at 85% 20%,rgba(201,169,97,.16),transparent 65%)}
.hero h1{font-weight:700;letter-spacing:.005em}
.hero h1 em{color:var(--gold-soft);font-style:italic}
.hero-inner::before{content:"";display:block;width:64px;height:2px;background:var(--sky-2);margin-bottom:22px}
.chip{background:rgba(255,255,255,.08);border:1px solid rgba(201,169,97,.45);border-radius:4px;font-weight:700;letter-spacing:.03em}
.hero::after{background:linear-gradient(to bottom,transparent,var(--bg))}

/* Tombol */
.btn{border-radius:4px;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;font-weight:700;box-shadow:none}
.btn-primary{background:var(--sky-2);color:var(--navy)}
.btn-primary:hover{background:var(--gold-soft);color:var(--navy)}
.btn-ghost{border-color:rgba(255,255,255,.55)}
.btn-blue{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-blue:hover{background:var(--gold);border-color:var(--gold);color:#fff}
.btn-outline{background:transparent;border-color:var(--navy);color:var(--navy)}
.btn-outline:hover{background:var(--navy);color:var(--gold-soft)}
.btn-sm{font-size:.7rem;padding:8px 14px}

/* Judul seksi */
.section-head h2,.page-title h1{color:var(--navy);font-weight:700}
.report-sec>h2{border-bottom:1px solid var(--sky-2);padding-bottom:12px;color:var(--navy);position:relative}
.report-sec>h2::after{content:"";position:absolute;left:0;bottom:-3px;width:60px;height:5px;background:var(--navy);border-radius:0}

/* Kartu */
.card,.panel,.doc-card,.act,.col-box,.comp,.char-list li,.butir li,.meta-table{border-radius:var(--radius)}
.card{border:1px solid var(--line);background:var(--surface);position:relative;overflow:hidden}
.card::after{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:linear-gradient(90deg,var(--sky-2),var(--gold-soft));transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
a.card:hover{transform:translateY(-6px);border-color:var(--sky-2)}
a.card:hover::after{transform:scaleX(1)}
.icon-card::before{display:none}
.ico{border-radius:50%;background:var(--bg);color:var(--navy);border:1px solid var(--sky-2);box-shadow:0 0 0 5px rgba(201,169,97,.12)}
.num{font-family:var(--serif);font-style:italic;font-size:2.6rem;color:var(--sky-2);font-weight:600}
.tag{background:var(--navy);color:var(--gold-soft);border-radius:3px;letter-spacing:.14em}
.tag.gold{background:var(--sky);color:#6E5120}
.go{color:var(--navy);letter-spacing:.06em;text-transform:uppercase;font-size:.74rem}

/* Prose & laporan */
.panel{border-top:3px solid var(--sky-2)}
.quote{border-left:3px solid var(--sky-2);background:linear-gradient(90deg,#F6EFDB,transparent);color:var(--navy)}
.meta-table{border-color:var(--line)}
.meta-table td:first-child{background:#F4EEDD;color:var(--navy)}
.butir li{border-left:3px solid var(--sky-2)}
.butir li::before{background:var(--gold);box-shadow:0 0 0 4px rgba(201,169,97,.25)}
.cycle-nav a{border-radius:4px;border:1px solid var(--line);background:#fff;letter-spacing:.03em}
.cycle-nav a:hover{border-color:var(--sky-2);color:var(--navy)}
.cycle-nav a.active{background:var(--navy);color:var(--gold-soft);border-color:var(--navy);box-shadow:none}
.col-box{border-top-width:3px}
.col-box h3{color:var(--navy)}

/* Profil */
.photo-frame{aspect-ratio:1/1;border-radius:50%;border:8px solid #fff;
  box-shadow:0 0 0 3px var(--sky-2),0 0 0 12px rgba(201,169,97,.20),0 22px 50px rgba(15,37,71,.22);background:var(--bg-2)}
.photo-frame img{object-position:50% 14%}
.mission{background:linear-gradient(135deg,var(--navy),var(--blue));border-left:5px solid var(--sky-2);border-radius:var(--radius)}
.mission .kicker{color:var(--gold-soft)!important}
.mission .kicker::before,.mission .kicker::after{background:var(--gold-soft)}
.mission h3{color:#fff}
.comp .dot{background:var(--navy);color:var(--gold-soft);border-radius:50%;border:1.5px solid var(--sky-2)}
.char-list li{border-left:3px solid var(--sky-2)}
.id-table td:first-child{color:var(--gold);font-weight:700;letter-spacing:.04em}

/* Non mengajar */
.act .n{background:var(--navy);color:var(--gold-soft);border-radius:50%;border:1.5px solid var(--sky-2)}
.pill{border:1px solid var(--sky-2);background:#fff;color:var(--navy);border-radius:4px}

/* Footer */
.site-footer{background:var(--navy);border-top:3px solid var(--sky-2);border-radius:0}
.site-footer h4{font-family:var(--serif);color:var(--gold-soft);font-size:1.1rem}
.site-footer a:hover{color:var(--gold-soft)}

/* Modal */
.modal-bar{background:var(--navy);border-bottom:2px solid var(--sky-2)}
.modal-bar b{color:var(--gold-soft)}
::selection{background:var(--sky);color:var(--navy)}

</style>

        <h3 style="margin-top:.4em">Medan: Harmoni Budaya dalam Satu Nafas Kota</h3>
        <p>Saya <strong>Kartina Angreni Nasution</strong> jurusan Pendidikan IPS, Program Profesi Guru (Calon Guru) tahun 2026 berasal dari Kota Medan. Di ujung barat Indonesia, berdiri Medan kota yang tumbuh dari riuh perdagangan, keberagaman budaya, dan denyut kehidupan yang tak pernah benar-benar tidur. Medan bukan sekadar ibu kota Sumatera Utara; ia adalah pertemuan banyak cerita. Melayu, Batak, Tionghoa, India, dan berbagai suku lainnya hidup berdampingan, menciptakan harmoni yang terasa dalam bahasa, wajah jalanan, hingga aroma rempah yang menguar dari sudut-sudut kota.</p>
        <p>Di pagi hari, Medan menyambut dengan hangat matahari yang memantul di antara bangunan tua dan hiruk pasar tradisional. Di siang hari, kota ini bergerak cepat angkot melintas, pedagang berseru, dan kehidupan berjalan dengan semangat yang khas. Namun ketika senja turun, Medan berubah menjadi puisi yang hidup: lampu-lampu kota menyala perlahan, suara azan bersahutan dengan denting kehidupan malam, dan langit jingga memeluk jalan-jalan yang penuh kenangan.</p>
        <p>Keindahan Medan tidak hanya terletak pada bangunannya, tetapi pada jiwanya. Kota ini mengajarkan tentang keberanian untuk tumbuh, tentang keberagaman yang saling merangkul, dan tentang kenangan yang tinggal lama di hati siapa pun yang pernah singgah. Dari megahnya Istana Maimun hingga keheningan sakral Masjid Raya Al-Mashun, Medan menyimpan jejak sejarah yang berpadu indah dengan modernitas. Bagi saya, Medan adalah kota yang tidak hanya dilihat, tetapi juga dirasakan melalui keramahan manusianya, cita rasa kulinernya, dan semangatnya yang selalu hidup.</p>
        <div class="quote">“Medan, Kota yang Menyimpan Banyak Cerita”<cite>— Kartina Angreni Nasution</cite></div>

    </div>

      `Pada pertemuan pertama, kegiatan dibuka dengan salam, doa bersama, serta pemeriksaan kehadiran dan kesiapan belajar murid. Guru kemudian melaksanakan asesmen awal berbasis TARL berupa kuis singkat tiga pertanyaan, misalnya mengenai perbedaan aturan di rumah dan di sekolah. Hasil kuis ini menjadi dasar bagi guru untuk memetakan murid ke dalam tiga level, yaitu Level 1 (Perlu Bimbingan), Level 2 (Cukup), dan Level 3 (Mahir). Setelah itu, guru membangun apersepsi melalui pertanyaan pemantik kontekstual, seperti apa yang terjadi jika di kelas tidak ada aturan dan mengapa kita harus mengantre di kantin, sebelum menyampaikan tujuan pembelajaran dan gambaran alur PBL.`,
      `Memasuki kegiatan inti, guru menayangkan gambar atau video pendek tentang pelanggaran norma di lingkungan sebagai stimulus orientasi masalah. Murid kemudian dikelompokkan sesuai hasil asesmen awal dan menerima LKPD terdiferensiasi dengan tingkat kompleksitas yang berbeda. Guru memberikan bimbingan intensif kepada kelompok Level 1 dengan menjelaskan definisi nilai dan norma secara sederhana melalui analogi, sementara kelompok Level 2 berdiskusi mandiri untuk membedakan nilai dan norma, dan kelompok Level 3 menganalisis jenis-jenis norma beserta contohnya di masyarakat. Guru berkeliling memantau dan memberikan *scaffolding* sesuai kebutuhan masing-masing level.`,
      `Selanjutnya, setiap kelompok melakukan wawancara singkat atau observasi di lingkungan sekolah, atau mengingat pengalaman pribadi, terkait penerapan nilai dan norma. Murid mengisi LKPD dengan mencatat tiga pelanggaran norma yang pernah dilihat dan tiga contoh penerapan norma yang baik, sementara guru mendorong diskusi kritis dalam kelompok. Setiap kelompok kemudian membuat rangkuman temuan di kertas plano dan mempresentasikannya secara singkat, diikuti tanggapan dari kelompok lain. Guru memberikan umpan balik dan meluruskan miskonsepsi, misalnya membedakan norma kesopanan dan kesusilaan. Kegiatan ditutup dengan menyimpulkan pengertian, perbedaan, dan jenis nilai dan norma, refleksi mengenai hal baru yang dipelajari, serta penyampaian rencana pertemuan berikutnya.`,
      `Pada pertemuan kedua, pembelajaran dibuka dengan salam, doa, dan apersepsi TARL untuk mengingat kembali konsep sebelumnya. Murid dikelompokkan kembali ke dalam level yang sama, lalu guru mengajukan pertanyaan pemantik mengenai pengalaman melihat konflik akibat pelanggaran aturan dan cara menyelesaikannya secara adil. Guru kemudian membagikan Lembar Kasus Nyata dengan tingkat kesulitan berbeda: Level 1 menerima kasus sederhana tentang seragam yang terlupakan, Level 2 menerima kasus menengah tentang gosip di grup kelas, dan Level 3 menerima kasus kompleks tentang perselisihan batas tanah kampung. Murid membaca dan memahami kasus, lalu berdiskusi mengidentifikasi akar masalah, norma yang dilanggar, dan pihak yang dirugikan, dengan pendampingan khusus bagi kelompok Level 1.`,
      `Dalam tahap penyelidikan, murid merumuskan solusi berdasarkan nilai dan norma yang berlaku serta mengaitkannya dengan kearifan lokal, seperti penyelesaian secara kekeluargaan atau musyawarah sesuai tradisi kampung. Guru membimbing agar solusi tidak hanya bersifat menghukum, tetapi juga mendidik, baik preventif maupun kuratif. Setiap kelompok menyiapkan presentasi dalam bentuk poster, peta konsep, atau *role play* singkat, kemudian mempresentasikan hasil analisis dan solusinya, diikuti sesi tanya jawab antarkelompok. Guru memberikan penguatan, menilai keaktifan serta ketepatan analisis, dan mengapresiasi kelompok dengan solusi paling kreatif dan aplikatif. Kegiatan ditutup dengan menyimpulkan bahwa kepatuhan terhadap nilai dan norma adalah kunci terciptanya lingkungan yang harmonis, refleksi berupa komitmen untuk mematuhi norma di sekolah dan rumah, serta asesmen sumatif opsional berupa esai reflektif.`,
      `Secara keseluruhan, praktik mengajar ini menunjukkan koherensi antara pendekatan TARL dan model PBL. Diferensiasi level memungkinkan setiap murid belajar sesuai kesiapan kognitifnya, sementara sintaks PBL membimbing murid menuju kemampuan berpikir kritis dan solutif dalam konteks permasalahan nyata di lingkungan mereka, dengan tetap menjunjung nilai kearifan lokal.`
    ],
    strategi: [
      { t: 'Pendekatan *Teaching at the Right Level* (TARL)', i: `Asesmen awal (kuis diagnostik) untuk memetakan murid ke dalam tiga level, dilanjutkan pengelompokan serta diferensiasi materi, LKPD, dan proses (Level 1 dibimbing intensif, Level 3 mandiri dan menjadi tutor sebaya).` },
      { t: 'Model *Problem Based Learning* (PBL)', i: `Pembelajaran berpusat pada masalah nyata melalui lima fase: orientasi masalah (video/gambar pelanggaran norma), mengorganisasi belajar, membimbing penyelidikan (observasi/wawancara dan analisis kasus), mengembangkan dan menyajikan karya (poster, peta konsep, *role play*), serta menganalisis dan mengevaluasi proses.` },
      { t: 'Diskusi Kelompok Berbasis Kearifan Lokal dan Asesmen Autentik', i: `Murid berdiskusi dan mempresentasikan solusi yang dikaitkan dengan nilai budaya lokal (musyawarah, kekeluargaan), didukung asesmen diagnostik, formatif (observasi sikap, LKPD, presentasi), dan sumatif (esai reflektif) dengan rubrik penilaian yang mencakup pemahaman konsep, analisis masalah, solusi, serta kolaborasi.` }
    ],
    analisis: {
      kelebihan: [
        { t: 'Integrasi TARL yang Sistemik dan Terukur', i: `Asesmen awal (kuis diagnostik) digunakan secara fungsional untuk memetakan murid ke dalam tiga level, yang kemudian ditindaklanjuti dengan diferensiasi materi, LKPD, dan proses pembelajaran, sehingga setiap murid belajar sesuai kesiapan kognitifnya.` },
        { t: 'Sintaks PBL yang Lengkap dan Kontekstual', i: `Kelima fase PBL dijalankan secara runtut dengan stimulus masalah nyata di lingkungan sekitar (pelanggaran norma, konflik sosial), mendorong murid berpikir kritis, kolaboratif, dan solutif terhadap permasalahan yang dekat dengan kehidupan mereka.` },
        { t: 'Diferensiasi Kasus dan LKPD yang Proporsional', i: `Tingkat kompleksitas kasus disesuaikan dengan level murid (Level 1: kasus sederhana dengan panduan; Level 2: kasus menengah; Level 3: kasus kompleks tanpa panduan ketat), sehingga tidak ada murid yang merasa terlalu mudah atau terlalu terbebani.` },
        { t: 'Penguatan Kearifan Lokal dan Asesmen Autentik', i: `Solusi masalah diarahkan pada nilai budaya lokal (musyawarah, kekeluargaan), didukung asesmen berlapis (diagnostik, formatif melalui observasi sikap dan LKPD, serta sumatif berupa esai reflektif) dengan rubrik yang mencakup pemahaman konsep, analisis, solusi, dan kolaborasi.` }
      ],
      kelemahan: [
        { t: 'Beban Pengelolaan Kelas yang Tinggi bagi Guru', i: `Mengelola tiga level kelompok sekaligus dengan kebutuhan bimbingan berbeda dalam satu waktu (terutama mendampingi Level 1 secara intensif sambil memantau Level 2 dan 3) menuntut kemampuan manajemen kelas dan energi guru yang besar, sehingga berisiko membuat level tertentu kurang terperhatikan.` },
        { t: 'Risiko Kesenjangan Waktu Antarlevel', i: `Kelompok Level 3 yang bekerja mandiri cenderung menyelesaikan tugas lebih cepat, sementara Level 1 membutuhkan waktu lebih lama dengan bimbingan intensif; tanpa pengaturan waktu yang ketat, hal ini dapat mengganggu keselarasan tahapan PBL antarkelompok.` },
        { t: 'Potensi Labeling dan Dampak Psikologis pada Murid', i: `Pengelompokan permanen berdasarkan level (terutama pada dua pertemuan berturut-turut) berisiko menimbulkan efek labeling, di mana murid Level 1 merasa inferior dan murid Level 3 merasa superior, sehingga dapat memengaruhi motivasi dan kepercayaan diri murid.` },
        { t: 'Minimnya Antisipasi Hambatan dan Instrumen Refleksi', i: `RPP belum memuat rencana alternatif (plan B) jika asesmen awal tidak akurat, murid resisten terhadap pengelompokan, atau waktu tidak mencukupi; selain itu, refleksi dan asesmen sumatif masih bersifat opsional sehingga pengukuran capaian pembelajaran secara menyeluruh kurang tegas.` }
      ]
    },
    refleksi: [
      `Praktik mengajar pada materi Nilai dan Norma Masyarakat di Lingkungan ini memberikan pengalaman mendidik yang berharga. Penerapan model *Problem Based Learning* (PBL) yang dipadukan dengan pendekatan *Teaching at the Right Level* (TARL) berhasil menciptakan pembelajaran yang aktif dan terarah. Peserta didik tampak terlibat secara tulus ketika menganalisis kasus nyata di lingkungan sekitar mulai dari seragam yang terlupakan, gosip di grup kelas, hingga perselisihan batas tanah kampung karena mereka dapat merasakan keterkaitan antara konsep nilai dan norma dengan persoalan yang benar-benar terjadi di kehidupan sehari-hari.`,
      `Pengalaman menerapkan TARL menegaskan pentingnya pemetaan kesiapan belajar awal. Melalui kuis diagnostik singkat, saya dapat mengelompokkan murid ke dalam tiga level dan menyesuaikan LKPD serta lembar kasus sesuai kompleksitasnya. Dengan adanya diferensiasi ini, murid yang membutuhkan penguatan dasar tidak merasa berkecil hati karena kasus yang diberikan lebih sederhana dan disertai panduan, sementara kelompok mahir tertantang menyelesaikan kasus kompleks secara mandiri dan bahkan berperan sebagai tutor sebaya. Namun demikian, pengelolaan waktu dan energi dalam mendampingi tiga level sekaligus menjadi catatan reflektif utama, karena bimbingan intensif pada Level 1 seringkali menyita perhatian sehingga pemantauan terhadap Level 2 dan 3 menjadi kurang optimal.`,
      `Selain itu, saya menyadari bahwa pengelompokan berbasis level yang dilakukan secara permanen pada dua pertemuan berpotensi menimbulkan efek labeling. Beberapa murid Level 1 terlihat kurang percaya diri ketika mengetahui dirinya berada di kelompok "perlu bimbingan", sementara murid Level 3 cenderung dominan dalam diskusi. Ke depannya, perlu ada strategi untuk memitigasi hal ini, misalnya dengan penamaan kelompok yang lebih netral, rotasi peran, atau penggabungan level pada kegiatan tertentu agar tercipta kolaborasi yang lebih setara. Meskipun demikian, secara keseluruhan, integrasi TARL dalam PBL ini terbukti mampu menggeser pembelajaran IPS dari sekadar hafalan konsep menuju pengalaman belajar yang kontekstual, kolaboratif, dan bermakna, di mana murid tidak hanya memahami nilai dan norma secara kognitif, tetapi juga belajar merumuskan solusi yang berlandaskan kearifan lokal untuk membangun lingkungan yang harmonis.`
    ],
    perbaikan: [
      { t: 'Optimalisasi Pengelolaan Waktu dan Pendampingan Multi-Level', i: `Menyusun jadwal pendampingan bergilir yang terstruktur agar semua level memperoleh perhatian proporsional, serta menyiapkan lembar pemantauan mandiri bagi Level 2 dan 3 agar tetap terarah tanpa harus selalu dibimbing guru.` },
      { t: 'Mitigasi Efek Labeling dan Penguatan Partisipasi Setara', i: `Menggunakan penamaan kelompok yang netral dan positif, menerapkan rotasi peran dalam kelompok, serta menggabungkan level pada kegiatan tertentu (presentasi/refleksi) untuk mendorong kolaborasi lintas kemampuan dan mencegah rasa inferior maupun dominasi.` },
      { t: 'Penguatan Asesmen Reflektif dan Antisipasi Hambatan', i: `Menjadikan esai reflektif sebagai asesmen sumatif wajib dengan jurnal refleksi terstruktur, serta menyiapkan *plan B* berupa penyesuaian level secara fleksibel dan versi cadangan LKPD/kasus untuk mengantisipasi ketidakakuratan asesmen awal atau kondisi kelas yang tidak terduga.` }
    ],
    kesimpulan: [
      `Penerapan model *Problem Based Learning* (PBL) yang terintegrasi dengan pendekatan Teaching at the Right Level (TARL) pada materi Nilai dan Norma Masyarakat di Lingkungan terbukti efektif menciptakan pembelajaran yang kontekstual, aktif, dan sesuai kesiapan belajar murid. Diferensiasi level melalui asesmen awal memungkinkan setiap murid belajar sesuai kemampuannya, sementara analisis kasus nyata berbasis kearifan lokal mendorong murid berpikir kritis dan solutif. Meskipun demikian, tantangan utama terletak pada pengelolaan waktu pendampingan multi-level dan potensi efek labeling akibat pengelompokan permanen. Oleh karena itu, rencana perbaikan ke depan diarahkan pada optimalisasi pendampingan bergilir, mitigasi labeling melalui penamaan netral dan rotasi peran, serta penguatan asesmen reflektif dan antisipasi hambatan. Secara keseluruhan, integrasi TARL dalam PBL ini perlu terus disempurnakan agar setiap murid memperoleh pengalaman belajar yang setara, bermakna, dan menghargai keberagaman kemampuan.`
    ],
    artefak: {
      ppt: 'https://drive.google.com/file/d/1kw2IguFbKDYPl_ugl-L9YdMru_QEluxn/view?usp=sharing',
      rpp: 'https://drive.google.com/file/d/1x3Z_o2Kr0CHsubzmcoCqr4y9so3twUvD/view?usp=sharing',

  /* ===== Siklus 3 — Praktik Mengajar Mandiri ===== */
  m3: {
    id: 'm3',
    kelompok: 'Mandiri',
    judul: 'Siklus 3 — Praktik Mengajar Mandiri',
    pendek: 'Mandiri 3',
    materi: 'Lembaga Sosial di Sekitar Tempat Tinggal',
    artefakJudul: 'Siklus 3 Praktik Mengajar Mandiri (Lembaga Sosial di Lingkungan Sekitar Kita)',
    deskripsi: [
      `Kegiatan praktik mengajar pada materi "Lembaga Sosial di Sekitar Tempat Tinggal" dilaksanakan di kelas VII SMP Negeri 2 Imogiri pada mata pelajaran IPS. Pembelajaran dirancang dua pertemuan (6 × 40 menit) dengan mengintegrasikan model *Teams Games Tournament* (TGT) berkerangka pendekatan *Differentiated Universal Provision* (DUP).`,
      `Pertemuan pertama berfokus pada penguasaan konsep dasar lembaga sosial (pengertian, ciri, jenis, dan fungsi). Sesi diawali apersepsi dan pertanyaan pemantik kontekstual, dilanjutkan pembagian kelompok heterogen bergaya DUP dengan nama lembaga sosial. Kegiatan inti diawali penyajian kelas melalui PPT aksesibel dan pembagian *cheat sheet* sebagai dukungan universal, kemudian murid bekerja dalam tim menyelesaikan LKPD 1 "Lembaga Sosial di Lingkunganku". Kelas melanjutkan turnamen akademik TGT melalui Babak 1 Kuis Wajib (benar +100, salah dilempar +50) dan Babak 2 Kuis Rebutan HOTS (benar +100, salah −25) dengan papan skor, lalu diakhiri penganugerahan "Juara Lembaga Sosial", penyimpulan, dan refleksi.`,
      `Pertemuan kedua memfokuskan pada asesmen sumatif individual. Setelah apersepsi dan penekanan nilai kejujuran, guru menerapkan dukungan aksesibilitas DUP, lalu murid mengerjakan 20 soal pilihan ganda dan 5 esai dengan dua paket soal (A reguler, B termodifikasi). Sesi dilanjutkan pembahasan pilihan ganda melalui penilaian silang dan umpan balik langsung, sementara esai dinilai di luar jam pelajaran. Kegiatan ditutup dengan penyimpulan, refleksi materi yang sulit, serta tindak lanjut remedial dan pengayaan.`
    ],
    strategi: [
      { t: 'Model *Teams Games Tournament* (TGT)', i: `Pembelajaran dilaksanakan melalui sintaks penyajian kelas, belajar dalam tim (LKPD identifikasi lembaga sosial), turnamen akademik (Kuis Wajib dan Kuis Rebutan HOTS dengan sistem poin), serta penghargaan tim (*Team Recognition*) untuk membangun motivasi, kolaborasi, dan sportivitas murid.` },
      { t: 'Pendekatan *Differentiated Universal Provision* (DUP)', i: `Diferensiasi diterapkan secara universal dalam kelas melalui kelompok heterogen (tutor sebaya), kuis berjenjang (mudah, sedang, HOTS), *cheat sheet* sebagai dukungan belajar, media PPT aksesibel (huruf besar dan warna kontras), serta *scaffolding* bagi kelompok yang tertinggal tanpa pemisahan materi secara kaku.` },
      { t: 'Pembelajaran Kolaboratif Berbasis Lingkungan dan Asesmen Autentik', i: `Murid mengidentifikasi lembaga sosial di sekitar tempat tinggal melalui diskusi kelompok dan studi kasus kontekstual, didukung asesmen formatif (observasi sikap kolaborasi dan sportivitas, LKPD, papan skor TGT) serta asesmen sumatif individual (pilihan ganda dan esai) dengan rubrik penilaian yang mencakup pemahaman konsep, analisis, dan kejelasan jawaban.` }
    ],
    analisis: {
      kelebihan: [
        { t: 'Integrasi DUP yang Inklusif dan Menyeluruh', i: `Dukungan belajar diberikan secara universal tanpa memisahkan murid ke dalam kelompok kaku, melalui kelompok heterogen (tutor sebaya), cheat sheet, kuis berjenjang, media PPT aksesibel, dan scaffolding, sehingga seluruh murid memperoleh kesempatan belajar yang setara.` },
        { t: 'Sintaks TGT yang Meningkatkan Motivasi dan Kolaborasi', i: `Alur penyajian kelas, belajar dalam tim, turnamen (Kuis Wajib dan Kuis Rebutan HOTS), hingga penghargaan tim menciptakan suasana kompetitif yang sportif dan mendorong kerja sama antaranggota kelompok.` },
        { t: 'Diferensiasi Konten dan Asesmen yang Proporsional', i: `Kuis berjenjang (mudah, sedang, HOTS) dan dua paket soal sumatif (Paket A reguler dan Paket B termodifikasi) mengakomodasi keberagaman kesiapan belajar murid tanpa menimbulkan labeling.` },
        { t: 'Asesmen Berlapis dan Kontekstual', i: `Asesmen formatif (observasi sikap kolaborasi dan sportivitas, LKPD, papan skor) dan sumatif (pilihan ganda dan esai) dirumuskan dengan rubrik yang jelas, serta materi dikaitkan dengan lingkungan sekitar tempat tinggal murid dan kearifan lokal.` }
      ],
      kelemahan: [
        { t: 'Dominasi Murid Berkemampuan Tinggi dalam Turnamen', i: `Sistem turnamen cenderung memberi keuntungan bagi murid yang cepat dan percaya diri, terutama pada Kuis Rebutan, sehingga murid yang lambat atau pemalu berisiko kurang berpartisipasi aktif.` },
        { t: 'Risiko Ketegangan Akibat Sistem Poin dan Hukuman', i: `Pemberian minus 25 poin pada jawaban salah rebutan dan pelemparan soal dapat menimbulkan kecemasan atau ketegangan antarkelompok, terutama bagi murid yang sensitif terhadap kompetisi.` },
        { t: 'Beban Pengelolaan Turnamen bagi Guru', i: `Mengelola papan skor, waktu menjawab, pembacaan soal, dan pendampingan kelompok tertinggal secara simultan menuntut keterampilan manajemen kelas dan energi yang besar, sehingga berisiko mengurangi kedalaman pendampingan konsep.` },
        { t: 'Asesmen Sumatif dan Tindak Lanjut Belum Sepenuhnya Terukur', i: `Penilaian esai dilakukan di luar jam pelajaran sehingga umpan balik tertunda, sementara mekanisme remedial dan pengayaan belum dirinci secara operasional, dan refleksi murid belum menggunakan instrumen terstruktur untuk mengukur kedalaman pemahaman.` }
      ]
    },
    refleksi: [
      `Praktik mengajar pada materi Lembaga Sosial di Sekitar Tempat Tinggal ini memberikan pengalaman mendidik yang berharga. Penerapan model *Teams Games Tournament* (TGT) yang dipadukan dengan pendekatan *Differentiated Universal Provision* (DUP) berhasil menciptakan dinamika kelas yang aktif dan menyenangkan. Peserta didik tampak terlibat secara tulus saat mengikuti turnamen akademik mulai dari Kuis Wajib hingga Kuis Rebutan HOTS karena suasana kompetisi yang sportif membuat mereka lebih antusias dalam memahami jenis, fungsi, dan peran lembaga sosial di lingkungan sekitar tempat tinggal mereka.`,
      `Pengalaman menerapkan DUP menegaskan pentingnya dukungan belajar yang inklusif tanpa memisahkan murid secara kaku. Dengan adanya kelompok heterogen, *cheat sheet* di meja, kuis berjenjang, serta media PPT aksesibel, murid yang membutuhkan penguatan tidak merasa tersisih, sementara murid yang lebih mampu tertantang menjawab soal HOTS dan berperan sebagai tutor sebaya. Namun demikian, pengelolaan turnamen menjadi catatan reflektif utama; sistem poin dan hukuman minus 25 pada Kuis Rebutan sempat menimbulkan ketegangan pada beberapa murid, dan murid yang pemalu cenderung kurang berpartisipasi aktif karena didominasi oleh teman yang lebih cepat dan percaya diri.`,
      `Selain itu, saya menyadari bahwa pengelolaan papan skor, waktu menjawab, dan pendampingan kelompok tertinggal secara simultan menuntut energi dan keterampilan manajemen kelas yang besar, sehingga kedalaman pendampingan konsep menjadi kurang optimal. Ke depannya, perlu ada strategi untuk memitigasi hal ini, misalnya dengan rotasi peran dalam kelompok, pengurangan sistem hukuman yang memicu kecemasan, serta pemberian kesempatan menjawab yang lebih merata. Meskipun demikian, secara keseluruhan, integrasi DUP dalam TGT ini terbukti mampu menggeser pembelajaran IPS dari sekadar hafalan konsep menuju pengalaman belajar yang kolaboratif, inklusif, dan bermakna, di mana murid tidak hanya memahami lembaga sosial secara kognitif, tetapi juga belajar bekerja sama, sportif, dan menghargai keberagaman kemampuan dalam tim.`
    ],
    perbaikan: [
      { t: 'Pemerataan Partisipasi dan Mitigasi Ketegangan dalam Turnamen', i: `Menerapkan aturan giliran menjawab bagi setiap anggota kelompok serta memberikan *think time* sebelum menjawab pada Kuis Rebutan, sekaligus mengurangi atau menghapus hukuman minus poin agar murid tidak takut berpartisipasi dan tetap menjunjung sportivitas.` },
      { t: 'Pengelolaan Turnamen yang Lebih Efisien', i: `Melibatkan asisten turnamen dari murid terpilih untuk membantu pencatatan poin dan menyederhanakan papan skor, sehingga guru dapat lebih fokus pada pendampingan konsep dan pengelolaan waktu tetap terkendali.` },
      { t: 'Penguatan Umpan Balik, Tindak Lanjut, dan Refleksi', i: `Menjadwalkan pembahasan esai secara singkat pada pertemuan berikutnya, merinci mekanisme remedial dan pengayaan secara operasional, serta menggunakan jurnal refleksi terstruktur agar kedalaman pemahaman murid dapat terukur secara objektif.` }
    ],
    kesimpulan: [

<script>
/* ==========================================================
   pages.js — merender halaman dinamis dari data.js
   ========================================================== */
(function () {
  'use strict';

  const $ = (sel) => document.querySelector(sel);
  const arrow = () => '<span aria-hidden="true" style="width:18px;height:18px;display:inline-block">' + ICONS.arrow + '</span>';

  /* ---------- Blok pembangun ---------- */
  function butir(items) {
    return '<ul class="butir">' + items.map(function (x) {
      return '<li>' + (x.t ? '<b>' + fmt(x.t) + '</b> : ' : '') + fmt(x.i) + '</li>';
    }).join('') + '</ul>';
  }

  function colBox(cls, title, items) {
    return '<div class="col-box ' + cls + '"><h3>' + title + '</h3><ul>' +
      items.map(function (x) {
        return '<li>' + (x.t ? '<b>' + fmt(x.t) + '.</b> ' : '') + fmt(x.i) + '</li>';
      }).join('') + '</ul></div>';
  }

  function analisis(a) {
    return '<div class="two-col">' +
      colBox('plus', 'Kelebihan Desain Pembelajaran', a.kelebihan) +
      colBox('minus', 'Kelemahan Desain Pembelajaran', a.kelemahan) +
      '</div>';
  }

  function paras(arr) { return arr.map(function (p) { return '<p>' + fmt(p) + '</p>'; }).join(''); }

  function sec(title, inner) {
    return '<section class="report-sec reveal"><h2>' + title + '</h2>' + inner + '</section>';
  }

  function metaTable(s) {
    const rows = [
      ['Nama Mahasiswa', MAHASISWA.nama],
      ['NIM', MAHASISWA.nim],
      ['Prodi/Bidang Studi', MAHASISWA.prodi],
      ['Sekolah PPL Mandiri', MAHASISWA.sekolah],
      ['Materi', s.materi],
      ['Kelas/Fase/Semester', MAHASISWA.kelas]
    ];
    return '<table class="meta-table">' + rows.map(function (r) {
      return '<tr><td>' + r[0] + '</td><td>:</td><td>' + esc(r[1]) + '</td></tr>';
    }).join('') + '</table>';
  }

  function laporan(s) {
    return '<h2 class="visually-hidden" style="position:absolute;left:-9999px">LAPORAN PRAKTIK MENGAJAR</h2>' +
      metaTable(s) +
      sec('A. Deskripsi Kegiatan Praktik Mengajar', paras(s.deskripsi)) +
      sec('B. Strategi Pembelajaran yang Digunakan', butir(s.strategi)) +
      sec('C. Analisis Kelebihan dan Kelemahan Desain Pembelajaran', analisis(s.analisis)) +
      sec('D. Refleksi Pengalaman Mengajar', paras(s.refleksi)) +
      sec('E. Rencana Perbaikan untuk Pembelajaran Mendatang', butir(s.perbaikan)) +
      sec('F. Kesimpulan', paras(s.kesimpulan));
  }

  function cycleNav(order, hrefBase, activeId) {
    return '<nav class="cycle-nav" aria-label="Pilih siklus">' + order.map(function (id) {
      const s = SIKLUS[id];
      return '<a href="' + hrefBase + id + '"' + (id === activeId ? ' class="active"' : '') + '>' + esc(s.pendek) + '</a>';
    }).join('') + '</nav>';
  }

  function pager(order, hrefBase, id) {
    const i = order.indexOf(id);
    const prev = order[i - 1], next = order[i + 1];
    return '<div class="pager">' +
      (prev ? '<a class="btn btn-outline" href="' + hrefBase + prev + '">← ' + esc(SIKLUS[prev].judul) + '</a>' : '<span></span>') +
      (next ? '<a class="btn btn-blue" href="' + hrefBase + next + '">' + esc(SIKLUS[next].judul) + ' →</a>' : '<span></span>') +
      '</div>';
  }

  function docCard(icon, title, desc, url) {
    return '<div class="doc-card reveal">' +
      '<div class="ico" style="margin-bottom:6px">' + ICONS[icon] + '</div>' +
      '<h3>' + title + '</h3><p>' + desc + '</p>' +
      '<div class="doc-actions">' +
        '<button type="button" class="btn btn-blue btn-sm" data-view="' + esc(url) + '" data-title="' + esc(title) + '">' + ICONS.eye + 'Lihat di sini</button>' +
        '<a class="btn btn-outline btn-sm" href="' + esc(url) + '" target="_blank" rel="noopener">' + ICONS.ext + 'Buka</a>' +
      '</div></div>';
  }

  function docGrid(a) {
    let h = '';
    if (a.lkpd) h += docCard('lkpd', 'Lembar Kerja Peserta Didik (LKPD)', 'LKPD yang digunakan murid selama pembelajaran.', a.lkpd);
    if (a.ppt) h += docCard('slides', 'Implementasi Media / Power Point', 'Media pembelajaran yang ditayangkan dan digunakan di kelas.', a.ppt);
    if (a.rpp) h += docCard('rpp', 'Rencana Pembelajaran Mendalam (RPM)', 'Perencanaan pembelajaran lengkap untuk siklus ini.', a.rpp);
    if (a.dok) h += docCard('camera', 'Dokumentasi Pelaksanaan Pembelajaran', 'Bukti visual jalannya kegiatan pembelajaran di kelas.', a.dok);
    return '<div class="doc-grid">' + h + '</div>';
  }

  function listCard(s, href, num, desc, goLabel) {
    return '<a class="card icon-card reveal" href="' + href + '">' +
      '<div class="num">' + num + '</div>' +
      '<span class="tag' + (s.kelompok === 'Terbimbing' ? ' gold' : '') + '">' + esc(s.kelompok) + '</span>' +
      '<h3>' + esc(s.judul) + '</h3>' +
      '<p><b>Materi:</b> ' + esc(s.materi) + '</p>' +
      (desc ? '<p style="margin-top:6px">' + desc + '</p>' : '') +
      '<span class="go">' + goLabel + ' ' + arrow() + '</span></a>';
  }

  /* ---------- Halaman ---------- */
  const PAGES = {

    pembelajaran: function () {
      $('#list').innerHTML = URUTAN_PEMBELAJARAN.map(function (id, i) {
        const s = SIKLUS[id];
        return listCard(s, '#/siklus/' + id, String(i + 1).padStart(2, '0'), '', 'Baca laporan siklus');
      }).join('');
    },

    siklus: function () {
      let id = window.ROUTE_ARG;
      if (!SIKLUS[id] || URUTAN_PEMBELAJARAN.indexOf(id) < 0) id = 't1';
      const s = SIKLUS[id];
      document.title = s.judul + ' — Portofolio PPG Kartina Angreni Nasution';
      $('#crumb').innerHTML = '<a href="#/">Beranda</a> / <a href="#/pembelajaran">Pembelajaran</a> / ' + esc(s.judul);
      $('#judul').textContent = s.judul;
      $('#sub').textContent = 'Laporan Praktik Mengajar — ' + s.materi;
      $('#nav').innerHTML = cycleNav(URUTAN_PEMBELAJARAN, '#/siklus/', id);
      $('#isi').innerHTML = laporan(s) +
        '<div class="card reveal" style="margin-top:10px;text-align:center"><h3>Lihat dokumen pendukung siklus ini</h3>' +
        '<p>LKPD, media pembelajaran, rencana pembelajaran, dan dokumentasi pelaksanaan.</p>' +
        '<a class="btn btn-blue" style="margin-top:16px" href="#/artefak/' + id + '">Buka Artefak ' + esc(s.pendek) + '</a></div>' +
        pager(URUTAN_PEMBELAJARAN, '#/siklus/', id);
    },

    artefak: function () {
      $('#list').innerHTML = URUTAN_PEMBELAJARAN.map(function (id, i) {
        const s = SIKLUS[id];
        return listCard(s, '#/artefak/' + id, String(i + 1).padStart(2, '0'),
          'Media/Power Point, Rencana Pembelajaran Mendalam, dan Dokumentasi Pelaksanaan.', 'Lihat artefak');
      }).join('');
    },

    artefakdetail: function () {
      let id = window.ROUTE_ARG;
      if (!SIKLUS[id] || URUTAN_PEMBELAJARAN.indexOf(id) < 0) id = 't1';
      const s = SIKLUS[id];
      document.title = 'Artefak ' + s.pendek + ' — Portofolio PPG Kartina Angreni Nasution';
      $('#crumb').innerHTML = '<a href="#/">Beranda</a> / <a href="#/artefak">Artefak</a> / ' + esc(s.artefakJudul);
      $('#judul').textContent = s.artefakJudul;
      $('#sub').textContent = 'Dokumen proses dan hasil pembelajaran yang dapat dilihat langsung pada halaman ini.';
      $('#nav').innerHTML = cycleNav(URUTAN_PEMBELAJARAN, '#/artefak/', id);
      $('#isi').innerHTML =
        '<h2 class="reveal" style="font-family:var(--serif);color:var(--navy);margin-bottom:18px">Dokumen Pembelajaran</h2>' +
        docGrid(s.artefak) +
        '<p class="note">Jika pratinjau tidak tampil, klik tombol “Buka” untuk membuka dokumen di tab baru.</p>' +
        '<h2 class="reveal" style="font-family:var(--serif);color:var(--navy);margin:46px 0 6px">Refleksi Singkat</h2>' +
        '<p class="reveal" style="color:var(--muted);margin-bottom:18px">Analisis Kelebihan dan Kelemahan Desain Pembelajaran — ' + esc(s.materi) + '</p>' +
        '<div class="reveal">' + analisis(s.analisis) + '</div>' +
        '<div class="pager"><a class="btn btn-outline" href="#/siklus/' + id + '">Baca laporan lengkap siklus ini</a></div>' +
        pager(URUTAN_PEMBELAJARAN, '#/artefak/', id);
    },

    utsuas: function () {
      $('#list').innerHTML = URUTAN_UTSUAS.map(function (id, i) {
        const s = SIKLUS[id];
        return listCard(s, '#/uts-uas/' + id, String(i + 1).padStart(2, '0'),
          'Laporan, video praktik pembelajaran, dan artefak siklus terbaik.', 'Buka halaman ' + s.pendek);
      }).join('');
    },

    utsuasdetail: function () {
      let id = window.ROUTE_ARG;
      if (URUTAN_UTSUAS.indexOf(id) < 0) id = 'uts';
      const s = SIKLUS[id];
      document.title = s.judul + ' — Portofolio PPG Kartina Angreni Nasution';
      $('#crumb').innerHTML = '<a href="#/">Beranda</a> / <a href="#/uts-uas">UTS &amp; UAS</a> / ' + esc(s.judul);
      $('#judul').textContent = s.judul;
      $('#sub').textContent = 'Siklus terbaik ' + s.pendek + ' — ' + s.materi;
      $('#nav').innerHTML = cycleNav(URUTAN_UTSUAS, '#/uts-uas/', id);

      const v = s.video;
      const vEmbed = '<div class="embed ' + (v.tipe === 'folder' ? 'folder' : 'video') + '"><iframe src="' + esc(embedUrl(v.url)) + '" title="' + esc(v.label) + '" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe></div>';
      const videoSec = sec('Video Praktik Pembelajaran',
        vEmbed +
        '<p class="note">Jika video tidak tampil, <a href="' + esc(v.url) + '" target="_blank" rel="noopener">buka video ' + s.pendek + ' di Google Drive</a>.</p>');

      $('#isi').innerHTML = videoSec + laporan(s) +
        sec('Artefak ' + s.pendek + ' — ' + esc(s.artefakJudul.replace(/^Artefak (UTS|UAS) /, '')), docGrid(s.artefak)) +
        pager(URUTAN_UTSUAS, '#/uts-uas/', id);
    },

    refleksi: function () {
      let h = '';
      URUTAN_PEMBELAJARAN.forEach(function (id, i) {
        const s = SIKLUS[id];
        h += '<article class="card reflect-card reveal">' +
          '<span class="tag' + (s.kelompok === 'Terbimbing' ? ' gold' : '') + '">' + esc(s.kelompok) + '</span>' +
          '<h3>' + esc(s.judul) + ' — ' + esc(s.materi) + '</h3>' +
          '<div class="sub">Refleksi Pengalaman Mengajar</div>' + '<div class="prose">' + paras(s.refleksi) + '</div>' +
          '<div class="sub">Catatan Evaluasi (Kelemahan Desain)</div>' + '<div class="prose" style="margin-bottom:0">' + butir(s.analisis.kelemahan) + '</div>' +
          '<div class="sub">Rencana Perbaikan</div>' + butir(s.perbaikan) +
          '<a class="go" href="#/siklus/' + id + '">Baca laporan lengkap ' + arrow() + '</a>' +
          '</article>';
      });
      $('#list').innerHTML = h;
      $('#benang').innerHTML = paras(SIKLUS.m4.kesimpulan);
    }
  };

  PAGES.index = PAGES.profil = PAGES.nonmengajar = function () {};
  window.PAGES = PAGES;
})();

</script>
<script>
/* ==========================================================
   router.js — navigasi satu-berkas (hash routing)
   ========================================================== */
(function () {
  'use strict';
  var app = document.getElementById('app');

  var LIST = {
    'pembelajaran': { title: 'Pembelajaran', kicker: 'Perjalanan Belajar', h1: 'Pelaksanaan Pembelajaran',
      sub: 'Satu siklus praktik mengajar terbimbing dan empat siklus praktik mengajar mandiri. Pilih siklus yang ingin Anda baca.' },
    'artefak': { title: 'Artefak', kicker: 'Karya & Dokumen', h1: 'Artefak Pembelajaran',
      sub: 'Dokumen yang berkaitan dengan proses dan hasil pembelajaran, dibagi dalam satu siklus terbimbing dan empat siklus mandiri.' },
    'uts-uas': { title: 'UTS dan UAS', kicker: 'Siklus Terbaik', h1: 'UTS dan UAS',
      sub: 'Satu siklus terbaik UTS dan satu siklus terbaik UAS, lengkap dengan video praktik pembelajaran dan perangkat pembelajarannya.' }
  };

  function listShell(k) {
    var d = LIST[k];
    return '<main><div class="container"><div class="page-title">' +
      '<div class="crumbs"><a href="#/">Beranda</a> / ' + d.title + '</div>' +
      '<span class="kicker">' + d.kicker + '</span><h1>' + d.h1 + '</h1><p>' + d.sub + '</p><div class="rule"></div></div>' +
      '<div class="grid grid-3" id="list" style="padding-bottom:30px"></div></div></main>';
  }

  var DETAIL = '<main><div class="narrow" style="width:min(940px,92%)"><div class="page-title left">' +
    '<div class="crumbs" id="crumb"></div><h1 id="judul"></h1><p id="sub"></p></div>' +
    '<div id="nav"></div><div id="isi"></div></div></main>';

  function tpl(id) { return document.getElementById(id).textContent; }

  function fillIcons() {
    document.querySelectorAll('[data-icon]').forEach(function (e) { e.innerHTML = ICONS[e.dataset.icon] || ''; });
  }

  function show(page, view, html, scrollId, title) {
    app.innerHTML = html;
    document.body.dataset.page = page;
    window.ROUTE_VIEW = view;
    document.title = (title || 'Portofolio PPG Calon Guru IPS 2026') + ' — Kartina Angreni Nasution';
    window.__header();
    fillIcons();
    if (window.PAGES[view]) window.PAGES[view]();
    fillIcons();
    initReveal();
    var t = scrollId && document.getElementById(scrollId);
    if (t) { setTimeout(function () { t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60); }
    else { window.scrollTo(0, 0); }
  }

  function route() {
    var h = location.hash.replace(/^#\/?/, '');
    var parts = h.split('/');
    var r = parts[0] || 'index';
    var arg = parts[1] || '';
    window.ROUTE_ARG = arg;

    switch (r) {
      case 'index': case 'jelajah': case 'lokasi':
        return show('index', 'index', tpl('tpl-index'), r === 'index' ? '' : r, 'Portofolio PPG Calon Guru IPS 2026');
      case 'profil':
        return show('profil', 'profil', tpl('tpl-profil'), '', 'Profil Mahasiswa');
      case 'pembelajaran':
        return show('pembelajaran', 'pembelajaran', listShell('pembelajaran'), '', 'Pembelajaran');
      case 'siklus':
        return show('pembelajaran', 'siklus', DETAIL, '', 'Laporan Siklus');
      case 'artefak':
        return arg ? show('artefak', 'artefakdetail', DETAIL, '', 'Artefak Siklus')
                   : show('artefak', 'artefak', listShell('artefak'), '', 'Artefak');
      case 'refleksi':
        return show('refleksi', 'refleksi', tpl('tpl-refleksi'), '', 'Refleksi dan Penilaian');
      case 'uts-uas':
        return arg ? show('utsuas', 'utsuasdetail', DETAIL, '', 'UTS dan UAS')
                   : show('utsuas', 'utsuas', listShell('uts-uas'), '', 'UTS dan UAS');
      case 'non-mengajar': case 'evaluasi': case 'dokumentasi':
        return show('nonmengajar', 'nonmengajar', tpl('tpl-non'), r === 'non-mengajar' ? '' : r, 'Kegiatan Non Mengajar');
      default:
        location.hash = '#/';
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    window.__init();
    window.addEventListener('hashchange', route);
    route();
  });
})();

</script>
